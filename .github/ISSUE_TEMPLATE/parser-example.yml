name: Synthetic parser example
description: Describe a parsing or matching problem with a made-up example.
title: "[Parser] "
body:
  - type: markdown
    attributes:
      value: "Write a new fictional example. Do not paste a real email, even with its name removed. Use invented identifiers, names, addresses, and example domains."
  - type: input
    id: version
    attributes:
      label: Version or commit used
  - type: textarea
    id: example
    attributes:
      label: Synthetic input and candidate permit records
      description: Provide the smallest made-up example that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected interpretation and reason
      description: Explain the event, scope, and whether there is a unique permit match.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include only output produced from your synthetic input.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: All project data in this issue are invented, and I included no credentials or private links.
          required: true
