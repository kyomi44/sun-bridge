name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m sunbridge validate
      - run: python -m unittest discover -s tests -v
      - run: python -m sunbridge demo
      - run: python -m sunbridge setup --crm demo
      - run: python -m sunbridge doctor
      - run: python -m sunbridge run
      - run: python -m sunbridge integrations
      - run: python scripts/check_public_files.py --tracked
