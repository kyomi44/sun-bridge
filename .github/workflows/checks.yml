name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m sunbridge validate
      - run: python scripts/render_email_coverage.py --check
      - run: python -m unittest discover -s tests -v
      - run: python -m sunbridge demo
      - run: python -m sunbridge setup --crm demo
      - run: python -m sunbridge doctor
      - run: python -m sunbridge run
      - run: python -m sunbridge integrations
      - run: python scripts/check_public_files.py --tracked
  gmail-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r deploy/gmail-push/requirements.txt 'google-auth-oauthlib>=1.2,<2'
      # Keep the ordinary matrix dependency-free; exercise optional HTTP boundary
      # tests here instead of silently skipping them when Flask is not installed.
      # All tests use synthetic data and mocks, never cloud credentials or mail.
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q sunbridge/gmail_cloud.py sunbridge/gmail_listener.py scripts/authorize_gmail_listener.py
