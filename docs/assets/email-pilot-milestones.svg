<title id="coverage-title">Email milestones observed in the private pilot</title>
<desc id="coverage-description">Alphabetical AHJ milestone matrix. P means an exact milestone was proposed in a historical private review-only pilot, not validated production support. A dash means not demonstrated. No real-AHJ parser or automatic CRM update is enabled. An accessible table is in the coverage documentation.</desc>
<style>
